# Render Blueprint — deploys the entire ERP stack in one click.
# https://render.com/docs/blueprint-spec
#
# HOW TO USE:
#  1. Push this repo to GitHub
#  2. Go to render.com → New → Blueprint
#  3. Connect your repo — Render reads this file automatically
#  4. Fill in the two marked secrets (JWT_SECRET, JWT_REFRESH_SECRET) with the SAME
#     random string in both auth-service and api-gateway
#  5. After all services deploy, copy each service's public URL and set:
#       - AUTH_SERVICE_URL, ORDER_SERVICE_URL, etc. in api-gateway
#       - API_GATEWAY_URL in frontend
#       - CORS_ORIGIN (your frontend URL) in api-gateway

databases:
  - name: erp-db
    databaseName: erp_db
    user: erp_user
    plan: free
    region: oregon

services:

  # ─── Auth Service ───────────────────────────────────────────────────────────
  - type: web
    name: erp-auth
    runtime: docker
    dockerfilePath: ./services/auth-service/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        # Take the Render DB "Internal Database URL" and append ?schema=auth
        sync: false
      - key: JWT_SECRET
        # Generate a long random string — must be IDENTICAL in erp-gateway below
        sync: false
      - key: JWT_REFRESH_SECRET
        # Generate a different long random string — must be IDENTICAL in erp-gateway below
        sync: false
      - key: ACCESS_TOKEN_EXPIRY
        value: 15m
      - key: NODE_ENV
        value: production

  # ─── Order Service ───────────────────────────────────────────────────────────
  - type: web
    name: erp-orders
    runtime: docker
    dockerfilePath: ./services/order-service/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        # Render DB "Internal Database URL" + ?schema=orders
        sync: false
      - key: NODE_ENV
        value: production

  # ─── Inventory Service ───────────────────────────────────────────────────────
  - type: web
    name: erp-inventory
    runtime: docker
    dockerfilePath: ./services/inventory-service/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        # Render DB "Internal Database URL" + ?schema=inventory
        sync: false
      - key: NODE_ENV
        value: production

  # ─── Billing Service ─────────────────────────────────────────────────────────
  - type: web
    name: erp-billing
    runtime: docker
    dockerfilePath: ./services/billing-service/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        # Render DB "Internal Database URL" + ?schema=billing
        sync: false
      - key: NODE_ENV
        value: production

  # ─── API Gateway ─────────────────────────────────────────────────────────────
  - type: web
    name: erp-gateway
    runtime: docker
    dockerfilePath: ./services/api-gateway/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        # Must be the SAME value as in erp-auth above
        sync: false
      - key: AUTH_SERVICE_URL
        # https://erp-auth.onrender.com  (set after erp-auth is deployed)
        sync: false
      - key: ORDER_SERVICE_URL
        # https://erp-orders.onrender.com
        sync: false
      - key: INVENTORY_SERVICE_URL
        # https://erp-inventory.onrender.com
        sync: false
      - key: BILLING_SERVICE_URL
        # https://erp-billing.onrender.com
        sync: false
      - key: CORS_ORIGIN
        # https://erp-frontend.onrender.com  (set after erp-frontend is deployed)
        sync: false
      - key: NODE_ENV
        value: production

  # ─── Frontend ────────────────────────────────────────────────────────────────
  - type: web
    name: erp-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: API_GATEWAY_URL
        # https://erp-gateway.onrender.com  (set after erp-gateway is deployed)
        sync: false
      - key: NEXT_PUBLIC_WS_URL
        # wss://erp-gateway.onrender.com  (set after erp-gateway is deployed)
        sync: false
      - key: NODE_ENV
        value: production
