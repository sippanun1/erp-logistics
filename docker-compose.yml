services:
  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: erp_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp_user -d erp_db']
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: erp_auth
    restart: unless-stopped
    env_file: ./services/auth-service/.env
    environment:
      DATABASE_URL: postgresql://erp_user:erp_password@postgres:5432/erp_db?schema=auth
      PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy   # wait for DB to be ready before migrating
    volumes:
      - ./shared:/app/shared:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: erp_orders
    restart: unless-stopped
    env_file: ./services/order-service/.env
    environment:
      DATABASE_URL: postgresql://erp_user:erp_password@postgres:5432/erp_db?schema=orders
      PORT: 3002
      AUTH_SERVICE_URL: http://auth-service:3001
    ports:
      - '3002:3002'
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy   # wait for auth migrations to finish first
    volumes:
      - ./shared:/app/shared:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3002/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: erp_inventory
    restart: unless-stopped
    env_file: ./services/inventory-service/.env
    environment:
      DATABASE_URL: postgresql://erp_user:erp_password@postgres:5432/erp_db?schema=inventory
      PORT: 3003
      AUTH_SERVICE_URL: http://auth-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
    ports:
      - '3003:3003'
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    volumes:
      - ./shared:/app/shared:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3003/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  billing-service:
    build:
      context: .
      dockerfile: services/billing-service/Dockerfile
    container_name: erp_billing
    restart: unless-stopped
    env_file: ./services/billing-service/.env
    environment:
      DATABASE_URL: postgresql://erp_user:erp_password@postgres:5432/erp_db?schema=billing
      PORT: 3004
      AUTH_SERVICE_URL: http://auth-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
    ports:
      - '3004:3004'
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    volumes:
      - ./shared:/app/shared:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3004/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: erp_gateway
    restart: unless-stopped
    env_file: ./services/api-gateway/.env
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      BILLING_SERVICE_URL: http://billing-service:3004
      # Browser requests come from http://localhost (Nginx on port 80), not localhost:3005
      CORS_ORIGIN: http://localhost
    ports:
      - '3000:3000'
    depends_on:
      auth-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # In Docker Compose, Next.js rewrites proxy /api/* to the gateway container
        API_GATEWAY_URL: http://api-gateway:3000
        NEXT_PUBLIC_WS_URL: ws://localhost/ws  # browser hits Nginx on port 80
    container_name: erp_frontend
    restart: unless-stopped
    environment:
      API_GATEWAY_URL: http://api-gateway:3000
    ports:
      - '3005:3000'
    depends_on:
      - api-gateway

  nginx:
    image: nginx:alpine
    container_name: erp_nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - frontend

volumes:
  postgres_data:
